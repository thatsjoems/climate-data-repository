server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default nginx client_max_body_size is only 1MB - far below our own
    # app-level MAX_UPLOAD_SIZE_MB (50MB for the loan upload, see backend/app/core/config.py).
    # Without this, nginx silently rejects any upload over 1MB with a 413
    # BEFORE it ever reaches the backend, which then shows only a generic
    # "Failed to upload" error on the frontend with no useful detail. Set
    # slightly above the app's own limit so the app's own validation (which
    # gives a clear, specific error message) is what actually rejects an
    # oversized file, not a silent proxy-level cutoff.
    client_max_body_size 55M;

    # The three endpoints that read a whole file and check it row by row. nginx gives a proxied request only 60 seconds by default, and a file of the
    # largest size allowed (100,000 loans) takes longer than that (35 to 120 seconds, docs/LOAD_TESTING.md): the person got a time-out error (504, or 503
    # from some set-ups) although the application went on to finish, and trying again stored a second version. Same ten minutes as frontend/nginx.prod.conf.
    location ~ ^/api/(submissions/upload|climate-data/ingest|integration/climate-data)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Forward API calls to the backend container (service name "backend" in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # React Router / SPA fallback - any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
