server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default nginx client_max_body_size is only 1MB - far below our own
    # app-level MAX_UPLOAD_SIZE_MB (20MB, see backend/app/core/config.py).
    # Without this, nginx silently rejects any upload over 1MB with a 413
    # BEFORE it ever reaches the backend, which then shows only a generic
    # "Failed to upload" error on the frontend with no useful detail. Set
    # slightly above the app's own limit so the app's own validation (which
    # gives a clear, specific error message) is what actually rejects an
    # oversized file, not a silent proxy-level cutoff.
    client_max_body_size 25M;

    # Forward API calls to the backend container (service name "backend" in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router / SPA fallback - any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
