# Production web server: TLS, HTTP to HTTPS redirect, API proxy. Used only by docker-compose.prod.yml
# (mounted over the default configuration); the development stack keeps using nginx.conf.
server_tokens off;

# Plain HTTP: a health check for Docker, and a redirect for everything else.
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers will refuse plain HTTP to this address for a year. (No includeSubDomains or preload:
    # those are decisions for BOT ICT once the whole domain is ready for them.)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # What the browser may load for this application, and from where. Scripts: only our own files (there is no inline script and no eval, so a script
    # injected into a page cannot run). Styles may be inline because the interface sets styles on elements; fonts come from Google Fonts and the map
    # tiles from OpenStreetMap, the only two outside sources the application uses. The API is the same address, so connections go only there.
    # Nothing may frame the application, plug-ins are off, and forms post only to ourselves. If a page ever stops working after a change that adds a new
    # outside source, the browser console (F12) names the blocked address; add it here. To watch without enforcing, rename the header to
    # Content-Security-Policy-Report-Only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the application's own limit (20 MB), so the application gives the clear error.
    client_max_body_size 25M;

    # The three endpoints that read a whole file and check it row by row. A file of the largest size allowed (100,000 loans) took 96 seconds on the
    # test machine (docs/LOAD_TESTING.md), too close to the 120 seconds of the general limit below: on a slower machine the person would get a time-out
    # error although the server went on to finish (and trying again would store a second version). These endpoints alone may take up to five minutes.
    location ~ ^/api/(submissions/upload|climate-data/ingest|integration/climate-data)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # The application adds the same security headers itself; nginx's own (above) are the Bank's decision and the only ones sent, so none is doubled
        # (the application's HSTS, for one, says includeSubDomains for two years, which the decision above deliberately leaves out).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # The application adds the same security headers itself; nginx's own (above) are the Bank's decision and the only ones sent, so none is doubled
        # (the application's HSTS, for one, says includeSubDomains for two years, which the decision above deliberately leaves out).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
