# Climate Data Repository (CDR) - full stack, containerized.
#
# Usage:
#   docker compose up --build
#   Then open http://localhost:5173
#
# This is the ONLY supported way to run this project - see README.md.
# Uses PostgreSQL 16, matching the production-recommended stack.
#
# SECURITY NOTE: the POSTGRES_PASSWORD/SECRET_KEY defaults below are for local
# training/demo use ONLY. Before any real deployment, create a ".env" file next
# to this one (see .env.docker.example) with your own values - Docker Compose
# reads it automatically. The backend refuses to start with the default
# SECRET_KEY if ENVIRONMENT=production is set (see app/main.py).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: climate_data_repository
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdr_dev_only_change_me}
    volumes:
      - cdr_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-cdr_dev_only_change_me}@db:5432/climate_data_repository
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-unique-secret-before-production-use}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Short-lived on purpose - see app/core/config.py. Override via .env only
      # if you have a specific reason to change it; do not hardcode 480 here again.
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-15}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
      # Optional SMTP - leave blank to keep the manual credential-relay fallback (see docs/ASSUMPTIONS_AND_LIMITATIONS.md)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - cdr_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  cdr_postgres_data:
  cdr_uploads:
