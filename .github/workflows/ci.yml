name: CDR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (tests + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Syntax check
        working-directory: backend
        run: python -m py_compile $(find app -name "*.py")
      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-not-for-production
        run: pytest -v

  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: TypeScript build
        working-directory: frontend
        run: npm run build
